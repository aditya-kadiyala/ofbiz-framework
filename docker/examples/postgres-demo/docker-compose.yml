version: "2.4"

name: bwai-demo

services:
  db:
    container_name: bwai-postgres-demo
    image: postgres:13
    mem_limit: 300M
    memswap_limit: 300M
    cpu_shares: 200
    restart: "no"
    ports:
      - 5432:5432
    volumes:
      - ./postgres-initdb.d:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - postgres.env
      - ofbiz-postgres.env

  ofbiz:
    container_name: bwai-ofbiz-demo
    image: ofbiz-docker
    mem_limit: 1600M
    memswap_limit: 1600M
    cpu_shares: 200
    ports:
      - 8443:8443
    volumes:
      - ./after-config-applied.d:/docker-entrypoint-hooks/after-config-applied.d
      - ./logs:/ofbiz/runtime/logs
      - ofbiz-runtime:/ofbiz/runtime
    env_file:
      - ofbiz-postgres.env
    environment:
      OFBIZ_DATA_LOAD: demo
      OFBIZ_HOST: localhost
      OFBIZ_CONTENT_URL_PREFIX: https://localhost:8443
    depends_on:
      - db

volumes:
  postgres-data:
  ofbiz-runtime:
